services:
  blazor-webapp:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        razorlib: /srv/projects/docker/bgbahasajerman_RazorClassLibrary
    container_name: bgbj-fullblazorwebapp
    ports:
      - "0.0.0.0:8084:80"
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_RUNNING_IN_CONTAINER=true
      - Api__BaseUrl=http://100.117.149.44:8090/   # <-- add this line
    networks:
      - blazor-network
      - shared-net

networks:
  blazor-network:
    driver: bridge
  shared-net:
    external: true